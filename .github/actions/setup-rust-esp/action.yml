name: Set up Rust for ESP32
description: Install the Rust toolchain required by the selected firmware MCU
inputs:
  mcu:
    description: Firmware MCU (esp32c3 or esp32s3)
    required: true
runs:
  using: composite
  steps:
    - name: Install Rust for ESP32-C3
      if: inputs.mcu == 'esp32c3'
      shell: bash
      run: |
        rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
        rustup target add --toolchain 1.99.0 riscv32imc-unknown-none-elf
        cargo +1.99.0 fetch --manifest-path rust/Cargo.toml --locked --target riscv32imc-unknown-none-elf

    - name: Install Rust for ESP32-S3
      if: inputs.mcu == 'esp32s3'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        host="$(rustc -vV | sed -n 's/^host: //p')"
        curl --fail --location --retry 3 \
          "https://github.com/esp-rs/espup/releases/download/v0.17.1/espup-${host}" \
          --output "$RUNNER_TEMP/espup"
        chmod +x "$RUNNER_TEMP/espup"
        "$RUNNER_TEMP/espup" install --targets esp32s3 --toolchain-version 1.97.0.0
