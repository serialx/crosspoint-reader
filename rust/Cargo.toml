[workspace]
members = ["crates/xp-ui", "crates/xp-core", "crates/xp-ffi", "crates/xp-display", "crates/xp-core/src/gif/decoder"]
default-members = ["crates/xp-core"]
resolver = "2"
exclude = ["vendor/embedded-graphics-core-0.4.0", "vendor/az-1.2.1", "vendor/byteorder-1.5.0"]

[workspace.dependencies]
embedded-graphics-core = { path = "vendor/embedded-graphics-core-0.4.0", version = "=0.4.0" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 8
panic = "abort"
debug = true
# Keep Rust's release default; wrapping arithmetic is explicit in the hashes.
overflow-checks = false

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.xp-gif]
opt-level = 3

# Size-optimize UI construction and input routing separately from reader code.
[profile.release.package.xp-ui]
opt-level = "z"
