[workspace]
members = ["crates/xp-core", "crates/xp-ffi", "crates/xp-core/src/gif/decoder"]
default-members = ["crates/xp-core"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
# Keep Rust's release default; wrapping arithmetic is explicit in the hashes.
overflow-checks = false

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.xp-gif]
opt-level = 3
