[package]
name = "miniz_oxide"
version = "0.9.1"
edition = "2021"
license = "MIT OR Zlib OR Apache-2.0"
publish = false

[dependencies]
adler2 = { version = "=2.0.1", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("std", "serde", "simd", "with-alloc", "block-boundary", "rustc-dep-of-std"))', 'cfg(fuzzing)'] }
