[package]
name = "xp-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
test = false
bench = false

[dependencies]
xp-core = { path = "../xp-core" }

xp-display = { path = "../xp-display", optional = true }

[features]
display-panel = ["dep:xp-display"]
package-trace = ["xp-core/package-trace"]
chapter-trace = ["xp-core/chapter-trace"]
chapter-test = ["xp-core/chapter-test"]
