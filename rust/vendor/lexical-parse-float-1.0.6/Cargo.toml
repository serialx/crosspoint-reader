[package]
name = "lexical-parse-float"
version = "1.0.6"
edition = "2021"
rust-version = "1.60.0"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
compact = ["lexical-util/compact", "lexical-parse-integer/compact"]

[dependencies.lexical-util]
path = "../lexical-util-1.0.7"
version = "=1.0.7"
default-features = false
features = ["parse-floats"]
[dependencies.lexical-parse-integer]
path = "../lexical-parse-integer-1.0.6"
version = "=1.0.6"
default-features = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("std", "f16", "f128", "format", "lint", "power-of-two", "radix", "write-floats", "write-integers", "parse-floats", "parse-integers"))'] }
